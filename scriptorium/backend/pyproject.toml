[project]
name = "scriptorium-backend"
version = "0.0.0"
description = "Scriptorium backend (M0 skeleton — M1 implements)"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.34.0",
  "gunicorn==23.0.0",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "asyncpg==0.30.0",
  "celery==5.6.3",
  "redis==5.2.1",
  "pydantic==2.11.7",
  "sphinx==9.1.0",
  "docutils==0.22.4",
  "myst-parser==5.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4", "mypy==1.14.1", "pip-audit==2.9.0"]

[tool.ruff]
target-version = "py312"
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
