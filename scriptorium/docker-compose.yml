services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: scriptorium
      POSTGRES_PASSWORD: scriptorium
      POSTGRES_DB: scriptorium
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
