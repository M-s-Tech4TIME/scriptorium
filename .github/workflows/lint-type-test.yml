name: lint-type-test
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: scriptorium
          POSTGRES_PASSWORD: scriptorium
          POSTGRES_DB: scriptorium
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scriptorium"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://scriptorium:scriptorium@localhost:5432/scriptorium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.lock
      - run: ruff check backend/
      - run: ruff format --check backend/
      - run: mypy --config-file backend/pyproject.toml backend/
      - run: pytest backend/tests -W error
  docs-brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-docs.sh
