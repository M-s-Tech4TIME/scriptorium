name: lint-type-test
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: scriptorium
          POSTGRES_PASSWORD: scriptorium
          POSTGRES_DB: scriptorium
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scriptorium"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://scriptorium:scriptorium@localhost:5432/scriptorium
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.14.10" }
      - run: python -m pip install -r backend/requirements.lock
      - run: ruff check backend/
      - run: ruff format --check backend/
      - run: mypy --config-file backend/pyproject.toml backend/
      - run: pytest backend/tests -W error
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  docs-brain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/validate-docs.sh
