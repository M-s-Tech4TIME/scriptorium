name: security
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # OSS gitleaks CLI (decision: public repo for free CI, no paid license).
      # The gitleaks-action wrapper bills orgs; the Apache-2.0 CLI is free.
      - name: Secret scan (gitleaks OSS v8.30.1, sha256-pinned)
        run: |
          set -euo pipefail
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          /tmp/gitleaks detect --source . --verbose --redact --exit-code 1
      - uses: actions/setup-python@v7
        with: { python-version: "3.14.10" }
      - name: Python dependency audit
        run: |
          python -m pip install -r backend/requirements.lock
          pip-audit -r backend/requirements.lock --strict --progress-spinner off
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Node dependency audit
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
