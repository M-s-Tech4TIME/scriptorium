name: "scriptorium"
arch: "amd64"
platform: "linux"
version: "0.0.0"
release: "1"
maintainer: "M/s. Tech4TIME"
description: "Scriptorium docs platform"
license: "Proprietary"
contents:
  # Application code only. The installed venv is built separately from the
  # pinned lock and never includes the build-host .venv or caches.
  - src: backend/app
    dst: /opt/scriptorium/backend/app
  - src: backend/alembic
    dst: /opt/scriptorium/backend/alembic
  - src: backend/alembic.ini
    dst: /opt/scriptorium/backend/alembic.ini
  - src: backend/pyproject.toml
    dst: /opt/scriptorium/backend/pyproject.toml
  - src: backend/requirements.prod.lock
    dst: /opt/scriptorium/backend/requirements.prod.lock
  # Generated by packaging/scripts/fetch-python.sh / build-app-venv.sh.
  - src: packaging/python-runtime
    dst: /opt/scriptorium/runtime/python-3.14
  - src: packaging/app-venv
    dst: /opt/scriptorium/backend/.venv
  # Generated by packaging/scripts/build-venv.sh; never pip at install.
  - src: packaging/build-venv
    dst: /opt/scriptorium/build-venv
  # Generated by packaging/scripts/build-redis.sh.
  - src: packaging/redis-runtime
    dst: /opt/scriptorium/redis
  - src: frontend/dist
    dst: /opt/scriptorium/frontend-dist
  - src: packaging/config.env.example
    dst: /usr/share/doc/scriptorium/config.env.example
  - src: packaging/redis.conf.example
    dst: /usr/share/doc/scriptorium/redis.conf.example
  - src: packaging/systemd/scriptorium-redis.service
    dst: /lib/systemd/system/scriptorium-redis.service
  - src: packaging/systemd/scriptorium-web.service
    dst: /lib/systemd/system/scriptorium-web.service
  - src: packaging/systemd/scriptorium-worker.service
    dst: /lib/systemd/system/scriptorium-worker.service
overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - postgresql-client
  rpm:
    depends:
      - glibc
      - libgcc
      - postgresql
scripts:
  postinstall: packaging/scripts/postinst.sh
  preremove: packaging/scripts/prerm.sh
