name: "scriptorium"
arch: "amd64"
platform: "linux"
version: "0.0.0"
release: "1"
maintainer: "M/s. Tech4TIME"
description: "Scriptorium docs platform"
license: "Proprietary"
contents:
  - src: ../backend
    dst: /opt/scriptorium/backend
  # Generated by ./scripts/build-venv.sh before nfpm runs; never pip at install.
  - src: ./build-venv
    dst: /opt/scriptorium/build-venv
  - src: ../frontend/dist
    dst: /opt/scriptorium/frontend-dist
  - src: ./config.env.example
    dst: /usr/share/doc/scriptorium/config.env.example
  - src: ./systemd/scriptorium-web.service
    dst: /lib/systemd/system/scriptorium-web.service
  - src: ./systemd/scriptorium-worker.service
    dst: /lib/systemd/system/scriptorium-worker.service
overrides:
  deb:
    depends: ["python3.12", "postgresql-client", "redis"]
  rpm:
    depends: ["python3.12", "postgresql", "redis"]
scripts:
  postinstall: ./scripts/postinst.sh
  preremove: ./scripts/prerm.sh
