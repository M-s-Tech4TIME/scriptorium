[project]
name = "scriptorium-backend"
version = "0.0.0"
description = "Scriptorium backend (M1: schema + migrate CLI + health)"
requires-python = "==3.14.*"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "gunicorn==26.2.0",
  "sqlalchemy[asyncio]==2.1.6",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "celery==5.6.3",
  "redis==6.4.0",
  "pydantic==2.14.1",
  "argon2-cffi==25.1.0",
  "PyJWT==2.15.1",
  "sphinx==9.2.0",
  "docutils==0.22.4",
  "myst-parser==5.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1", "pip-audit==2.10.1", "httpx==0.28.1", "types-Pygments==2.21.0.20260819"]

[project.scripts]
scriptorium-admin = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error"

[tool.ruff]
target-version = "py314"
[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# docutils has no type stubs / py.typed; conversion probes validated the API
# surface we use (decision 0017).
module = "docutils.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# celery likewise ships no py.typed marker; the worker surface in use is
# pinned and narrow (Celery app/broker wiring, task registration — M4,
# decision 0026) and is exercised by the M4 tests.
module = "celery.*"
ignore_missing_imports = true
follow_imports = "skip"
