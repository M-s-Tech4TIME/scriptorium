[project]
name = "scriptorium-backend"
version = "0.0.0"
description = "Scriptorium backend (M1: schema + migrate CLI + health)"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.34.0",
  "gunicorn==23.0.0",
  "sqlalchemy[asyncio]==2.1.4",
  "alembic==1.20.0",
  "asyncpg==0.30.0",
  "celery==5.6.3",
  "redis==5.2.1",
  "pydantic==2.11.7",
  "argon2-cffi==25.1.0",
  "PyJWT==2.15.1",
  "sphinx==9.1.0",
  "docutils==0.22.4",
  "myst-parser==5.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4", "mypy==1.14.1", "pip-audit==2.9.0", "httpx==0.28.1"]

[project.scripts]
scriptorium-admin = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error"

[tool.ruff]
target-version = "py312"
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# docutils has no type stubs / py.typed; conversion probes validated the API
# surface we use (decision 0017).
module = "docutils.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# celery likewise ships no py.typed marker; the worker surface in use is
# pinned and narrow (Celery app/broker wiring, task registration — M4,
# decision 0026) and is exercised by the M4 tests.
module = "celery.*"
ignore_missing_imports = true
follow_imports = "skip"
